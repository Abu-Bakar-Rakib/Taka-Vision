<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Taka Vision - BD Banknote Detector</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <!-- ONNX Runtime Web for Browser-based AI Inference -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header class="top-nav">
      <div class="brand">
        <span class="flag">🇧🇩</span>
        <span class="title">Taka Vision</span>
      </div>
      <div class="telemetry">
        <span id="fps-badge" class="badge">-- FPS</span>
        <span id="status-badge" class="badge badge-warning">Loading AI...</span>
      </div>
    </header>

    <!-- Camera Viewport -->
    <main class="camera-viewport">
      <video id="webcam" playsinline autoplay muted></video>
      <canvas id="crop-canvas" width="224" height="224" style="display:none;"></canvas>

      <!-- Interactive Guide Box (ROI) -->
      <div id="roi-box" class="roi-box">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
        <div class="roi-label" id="roi-hint">Position note in box</div>
      </div>

      <!-- Quick Floating Camera Actions -->
      <div class="camera-actions">
        <button id="btn-flip" class="action-btn" title="Flip Camera" aria-label="Flip Camera">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 1.5.4 2.9 1.1 4.1l-2.1 2.1H8v-5l-1.9 1.9C5.5 12.1 5 11.1 5 10c0-3.86 3.14-7 7-7s7 3.14 7 7c0 1.66-.58 3.19-1.55 4.4l1.45 1.45C20.25 14.28 21 12.23 21 10zM16 19l1.9-1.9c.6 1 1.1 2 1.1 3.1 0 3.86-3.14 7-7 7s-7-3.14-7-7c0-1.66.58-3.19 1.55-4.4L5.1 14.35C3.75 16.02 3 18.07 3 20.3c0 4.42 3.58 8 8 8s8-3.58 8-8c0-1.5-.4-2.9-1.1-4.1l2.1-2.1H16v5z"/></svg>
        </button>
        <button id="btn-torch" class="action-btn" title="Toggle Flashlight" aria-label="Toggle Flashlight">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </button>
        <button id="btn-sound" class="action-btn active" title="Toggle Voice Readout" aria-label="Toggle Voice Readout">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>
        <button id="btn-roi" class="action-btn active" title="Toggle Guide Box" aria-label="Toggle Guide Box">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>
        </button>
      </div>
    </main>

    <!-- Bottom Detection Sheet -->
    <section class="bottom-sheet">
      <!-- Main Result Display -->
      <div id="result-card" class="result-card searching">
        <div class="result-header">
          <div class="result-left">
            <h2 id="note-value" class="note-value">Scanning...</h2>
            <div id="note-bengali" class="note-bengali">নোট স্ক্যান করা হচ্ছে</div>
          </div>
          <div class="result-right">
            <span id="note-confidence" class="confidence-pill">0%</span>
          </div>
        </div>
        <!-- Confidence Bar -->
        <div class="meter-track">
          <div id="confidence-bar" class="meter-fill" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Top 3 Probability Breakdown -->
      <div class="breakdown-card">
        <div class="breakdown-title">Top Candidates</div>
        <div class="breakdown-list" id="candidates-list">
          <div class="candidate-row"><span class="c-name">--</span><div class="c-bar-bg"><div class="c-bar" style="width:0%"></div></div><span class="c-pct">0%</span></div>
          <div class="candidate-row"><span class="c-name">--</span><div class="c-bar-bg"><div class="c-bar" style="width:0%"></div></div><span class="c-pct">0%</span></div>
          <div class="candidate-row"><span class="c-name">--</span><div class="c-bar-bg"><div class="c-bar" style="width:0%"></div></div><span class="c-pct">0%</span></div>
        </div>
      </div>

      <!-- Settings & Controls Accordion / Footer -->
      <div class="controls-row">
        <label for="threshold-slider" class="threshold-label">
          <span>Sensitivity (Threshold)</span>
          <span id="threshold-val" class="highlight">75%</span>
        </label>
        <input type="range" id="threshold-slider" min="30" max="95" value="75" step="5">
      </div>
    </section>

    <!-- Loading Modal -->
    <div id="loader-overlay" class="loader-overlay">
      <div class="loader-box">
        <div class="spinner"></div>
        <h3>Loading Taka Vision AI</h3>
        <p id="loader-status">Downloading neural network (~16MB)...</p>
        <div class="progress-bar-container">
          <div id="model-progress" class="progress-bar-fill"></div>
        </div>
        <small>The model is saved locally in your browser cache after first download.</small>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
